name: Tests (PostgreSQL)

# Runs the payment/provisioning concurrency suite against a real PostgreSQL
# database so the partial unique index on user_services.order_id and the
# multi-connection race test (ProvisioningConcurrencyTest::test_postgres_real_concurrency)
# are exercised on the production database engine — not just SQLite.

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
    branches: [ main ]

jobs:
  postgres:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: zedproxy_test
          POSTGRES_USER: zedproxy
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U zedproxy"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: zedproxy_test
      DB_USERNAME: zedproxy
      DB_PASSWORD: secret
      CACHE_STORE: array
      QUEUE_CONNECTION: sync

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql, mbstring, bcmath, intl, gd, redis, zip, pcntl
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare app
        run: |
          cp .env.example .env || true
          php artisan key:generate --force

      - name: Migrate (PostgreSQL)
        run: php artisan migrate --force

      - name: Provisioning concurrency + payment suite (PostgreSQL)
        run: php artisan test --testsuite=Feature --filter='ProvisioningConcurrencyTest|ProvisioningTest|PaymentTest|ReferralCommissionTest|RenewalTest|ServiceAddonTest'

      - name: Discount concurrency + reservation lifecycle (PostgreSQL)
        run: php artisan test --testsuite=Feature --filter='DiscountConcurrencyTest|DiscountConcurrencyPgTest|DiscountTest|DiscountAllFlowsTest'
