name: Tests

# Full application test suite on the default SQLite (:memory:) configuration
# from phpunit.xml. Complements tests-postgres.yml (which exercises only the
# concurrency/payment suite against a real PostgreSQL engine).

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest

    env:
      APP_ENV: testing
      CACHE_STORE: array
      QUEUE_CONNECTION: sync

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, intl, gd, redis, zip, sqlite3, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare app
        run: |
          cp .env.example .env || true
          php artisan key:generate --force

      - name: Run test suite
        run: php artisan test
