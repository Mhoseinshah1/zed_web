name: Tests

# Full application test suite on the default SQLite (:memory:) configuration
# from phpunit.xml. Complements tests-postgres.yml (which exercises only the
# concurrency/payment suite against a real PostgreSQL engine).

on:
  push:
    branches: [ main, 'claude/**', 'feat/**', 'fix/**' ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest

    env:
      APP_ENV: testing
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      # Point every artisan invocation (incl. composer's package:discover, which
      # boots providers that probe site_settings) at SQLite so it never tries the
      # default pgsql host — there is no database service in this job.
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, intl, gd, redis, zip, sqlite3, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare app
        run: |
          cp .env.example .env || true
          php artisan key:generate --force

      - name: Run test suite
        run: php artisan test

  deploy-scripts:
    # Validates the installer + atomic release-deployment shell scripts with
    # syntax checks, shellcheck, and fully MOCKED deployment scenarios. It never
    # performs a real deployment and never touches the runner's Nginx/PostgreSQL/
    # Supervisor.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Syntax-check all shell scripts
        run: |
          bash -n install.sh
          bash -n update.sh
          for f in $(find scripts tests -name '*.sh'); do
            echo "bash -n $f"
            bash -n "$f"
          done

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: ShellCheck (errors only)
        run: |
          shellcheck -S error -x \
            scripts/lib/deploy-lib.sh \
            scripts/deploy/deploy.sh \
            scripts/deploy/rollback.sh \
            scripts/deploy/deploy-status.sh \
            scripts/lib/installer-lib.sh \
            tests/deploy/run-tests.sh \
            tests/installer/run-tests.sh

      - name: Installer helper tests
        run: bash tests/installer/run-tests.sh

      - name: Deployment scenario tests (mocked)
        run: bash tests/deploy/run-tests.sh
