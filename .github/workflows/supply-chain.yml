name: Supply Chain

# Supply-chain / installer hardening checks. This workflow is self-contained and
# composes with the main CI pipeline (ci.yml): it focuses on the install/deploy
# scripts and the dependency trust chain. No repository secrets are used, so it
# is safe for pull-request runs (least-privilege `contents: read`).

on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feat/**'
      - 'chore/**'
      - 'hardening/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PHP_VERSION: '8.3'
  NODE_VERSION: '22'

jobs:
  # ── Shell tests + static checks (no network, no package managers) ───────────
  supply-chain-shell:
    name: Supply Chain Shell Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax (bash -n)
        run: |
          set -euo pipefail
          bash -n install.sh
          bash -n update.sh
          for f in $(find scripts tests -name '*.sh'); do bash -n "$f"; done

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: ShellCheck (errors only)
        run: |
          shellcheck -S error -x \
            scripts/lib/supply-chain-lib.sh \
            scripts/lib/installer-lib.sh \
            scripts/lib/deploy-lib.sh \
            scripts/deploy/deploy.sh \
            scripts/deploy/rollback.sh \
            scripts/deploy/deploy-status.sh \
            tests/supply-chain/run-tests.sh \
            tests/installer/run-tests.sh \
            tests/deploy/run-tests.sh
          shellcheck -S error install.sh

      - name: Supply-chain unit tests (25 mocked scenarios)
        run: bash tests/supply-chain/run-tests.sh

      - name: Installer + deployment helper tests (mocked)
        run: |
          bash tests/installer/run-tests.sh
          bash tests/deploy/run-tests.sh

      - name: Assert no unsafe supply-chain patterns remain
        run: |
          set -euo pipefail
          source scripts/lib/supply-chain-lib.sh
          if ! zsc_scan_forbidden install.sh update.sh \
                 scripts/deploy/deploy.sh scripts/deploy/rollback.sh \
                 scripts/deploy/deploy-status.sh scripts/backup.sh; then
            echo '::error::Unsafe supply-chain pattern found (curl|bash, curl|php, npm fallback, composer update).'
            exit 1
          fi
          # Belt-and-braces raw grep for the two banned pipes.
          if grep -REn '(curl|wget)[^|]*\|[[:space:]]*(bash|sh|php)([[:space:]]|-|$)' \
               install.sh update.sh scripts/ | grep -vE ':[[:space:]]*#'; then
            echo '::error::A curl|bash / curl|php pattern is present.'
            exit 1
          fi
          echo 'No unsafe supply-chain patterns.'

      - name: Lock files exist and version policy is declared
        run: |
          set -euo pipefail
          source scripts/lib/supply-chain-lib.sh
          zsc_require_lockfiles . >/dev/null || { echo '::error::composer.lock / package-lock.json missing'; exit 1; }
          test -n "$ZSC_SUPPORTED_UBUNTU" && test -n "$ZSC_NODE_MAJOR" && test -n "$ZSC_PHP_MIN"
          echo "Version policy: Ubuntu[$ZSC_SUPPORTED_UBUNTU] PHP[$ZSC_PHP_MIN-$ZSC_PHP_MAX] Node[$ZSC_NODE_MAJOR] PG[$ZSC_PG_MIN-$ZSC_PG_MAX] Redis[$ZSC_REDIS_MIN-$ZSC_REDIS_MAX]"

      - name: Validate deployment version-metadata generation
        run: |
          set -euo pipefail
          source scripts/lib/supply-chain-lib.sh
          sha="$(zsc_git_resolve . HEAD)"
          printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$' \
            || { echo '::error::resolved commit SHA is not a full 40-hex value'; exit 1; }
          tag="$(zsc_git_tag_for . "$sha" || true)"
          php_v="$(zsc_tool_version php)"
          # Prove a metadata record can be produced with a real resolved SHA.
          printf '{"commit":"%s","tag":"%s","php_version":"%s"}\n' "$sha" "$tag" "$php_v"
          echo 'Version metadata generation OK.'

  # ── Dependency audit + composer/npm validation (documented policy) ──────────
  supply-chain-audit:
    name: Supply Chain Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      AUDIT_ALLOWLIST: .zedproxy/audit-allowlist
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, bcmath, intl, zip
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-

      - name: composer validate --strict (lock matches composer.json)
        run: composer validate --strict --no-check-publish --no-interaction

      - name: Install dependencies (locked)
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Dependency audit under documented policy
        shell: bash
        run: |
          set -uo pipefail
          source scripts/lib/supply-chain-lib.sh
          today="$(date -u +%Y-%m-%d)"
          tmp="$(mktemp)"
          # Composer advisories → package<TAB>advisory<TAB>severity
          composer audit --format=json --no-interaction 2>/dev/null \
            | php -r '$d=json_decode(stream_get_contents(STDIN),true)?:[]; foreach(($d["advisories"]??[]) as $p=>$as){foreach($as as $a){printf("%s\t%s\t%s\n",$p,$a["advisoryId"]??($a["cve"]??"unknown"),strtolower($a["severity"]??"unknown"));}}' \
            >> "$tmp" || true
          # npm advisories → same shape
          npm audit --json 2>/dev/null \
            | php -r '$d=json_decode(stream_get_contents(STDIN),true)?:[]; foreach(($d["vulnerabilities"]??[]) as $n=>$v){$sev=strtolower($v["severity"]??"unknown");$id="npm"; if(!empty($v["via"])&&is_array($v["via"])){foreach($v["via"] as $via){if(is_array($via)){$id=(string)($via["url"]??$via["source"]??"npm");break;}}} printf("%s\t%s\t%s\n",$n,$id,$sev);}' \
            >> "$tmp" || true

          fails=0; findings=0
          while IFS=$'\t' read -r pkg adv sev; do
            [ -n "$pkg" ] || continue
            findings=$((findings+1))
            allowed=0
            zsc_allowlist_entry_active "$AUDIT_ALLOWLIST" "$pkg" "$adv" "$today" && allowed=1
            decision="$(zsc_audit_decision "$sev" "$allowed")"
            line="$(printf '%s advisory=%s severity=%s' "$pkg" "$adv" "$sev" | zsc_mask_secrets)"
            case "$decision" in
              fail)   echo "::error::[audit] BLOCKING $line"; fails=$((fails+1)) ;;
              report) [ "$allowed" = 1 ] && echo "[audit] allowlisted $line" || echo "::warning::[audit] $line" ;;
            esac
          done < "$tmp"
          rm -f "$tmp"
          echo "audit findings: $findings, blocking: $fails"
          [ "$fails" -eq 0 ] || { echo '::error::Critical/high (non-allowlisted) advisories present.'; exit 1; }

  # ── Secret scanning (redacted; no values printed) ───────────────────────────
  supply-chain-secrets:
    name: Supply Chain Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Fail if a real .env is committed
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo '::error::A real .env file is tracked in git.'; exit 1
          fi
          echo 'No committed .env files.'

      - name: Install gitleaks (pinned)
        run: |
          curl -sSfL --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Secret scan (redacted, working tree)
        run: |
          config=".gitleaks.toml"
          [ -f "$config" ] && cfg=(--config "$config") || cfg=()
          gitleaks detect --source . --no-git --no-banner --redact --exit-code 1 "${cfg[@]}"
