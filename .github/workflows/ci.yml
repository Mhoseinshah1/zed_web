name: CI

# Production-quality CI pipeline for the ZedProxy Laravel application.
#
# One workflow, seven independently-named jobs so branch protection can require
# each check by a stable name:
#
#   PHP Tests (SQLite)            — fast full suite + boot + config/route/view cache
#   Integration Tests (PostgreSQL) — real Postgres + Redis: financial/concurrency flows
#   Code Style                   — Pint, composer metadata, autoload, PHP syntax
#   Frontend Build               — npm ci + vite build (locked)
#   Shell Tests                  — installer/deploy shell scripts (mocked, no real infra)
#   Security Audit               — composer/npm audit, secret + private-key scanning
#   Migration Validation         — fresh Postgres migrate + status + pg index checks
#
# See README.md ("Continuous Integration") for versions, required checks, local
# equivalents, and the recommended branch-protection policy.

on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feat/**'
      - 'chore/**'
      - 'hardening/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Cancel superseded runs on the same ref so pushes don't pile up.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; individual jobs opt into more only when needed.
permissions:
  contents: read

env:
  PHP_VERSION: '8.3'
  NODE_VERSION: '22'

jobs:
  # ── Job 1 ──────────────────────────────────────────────────────────────────
  php-tests-sqlite:
    name: PHP Tests (SQLite)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      APP_ENV: testing
      # phpunit.xml already forces these for the suite; setting them as real env
      # vars also pins the config:/route:/view: cache compilation below.
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, bcmath, intl, gd, redis, zip, sqlite3, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-

      - name: Install dependencies (locked)
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare predictable testing environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Run test suite (SQLite)
        run: php artisan test

      - name: Compile config cache
        run: php artisan config:cache

      - name: Compile route cache
        run: php artisan route:cache

      - name: Compile view cache
        run: php artisan view:cache

  # ── Job 2 ──────────────────────────────────────────────────────────────────
  integration-postgres:
    name: Integration Tests (PostgreSQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: zedproxy_test
          POSTGRES_USER: zedproxy
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U zedproxy"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: zedproxy_test
      DB_USERNAME: zedproxy
      DB_PASSWORD: secret
      # Default store is array (matches the suite's own expectations); the
      # dedicated "Redis-backed" step below overrides CACHE_STORE=redis so
      # Cache::lock runs against the real Redis service.
      CACHE_STORE: array
      REDIS_CLIENT: phpredis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      QUEUE_CONNECTION: sync

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, pgsql, mbstring, bcmath, intl, gd, redis, zip, pcntl
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-

      - name: Install dependencies (locked)
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Verify Redis connectivity
        run: |
          php -r '$r = new Redis(); $r->connect("127.0.0.1", 6379); $r->set("ci_ping", "ok"); exit($r->get("ci_ping") === "ok" ? 0 : 1);'

      - name: Migrate (fresh, PostgreSQL)
        run: php artisan migrate --force

      - name: Provisioning + payment + wallet + commission (PostgreSQL)
        run: php artisan test --testsuite=Feature --filter='ProvisioningConcurrencyTest|ProvisioningTest|PaymentTest|WalletTest|ReferralCommissionTest|RenewalTest|ServiceAddonTest'

      - name: Discount concurrency + lifecycle (PostgreSQL)
        run: php artisan test --testsuite=Feature --filter='DiscountConcurrencyTest|DiscountConcurrencyPgTest|DiscountTest|DiscountAllFlowsTest'

      - name: Order idempotency + real-concurrency (PostgreSQL)
        run: php artisan test --testsuite=Feature --filter='OrderIdempotencyTest|OrderIdempotencyPgTest'

      - name: Email OTP registration + verification flows (PostgreSQL)
        # Default array cache store: each test gets a FRESH rate-limiter
        # state. (A shared Redis store here would let the per-IP registration
        # and verification throttles accumulate across tests into 429s.)
        run: php artisan test --testsuite=Feature --filter='EmailVerificationTest|EmailVerificationHardeningTest|EmailMailTestProofTest'

      - name: Email OTP real concurrency (PostgreSQL + Redis locks)
        # Real Redis-backed Cache::lock so the bounded per-user serialization
        # lock is exercised ACROSS the forked worker processes, on top of the
        # PostgreSQL row locks (EmailConcurrencyPgTest skips on SQLite).
        env:
          CACHE_STORE: redis
        run: php artisan test --testsuite=Feature --filter='EmailConcurrencyPgTest'

      - name: Concurrent email-address collisions (PostgreSQL)
        env:
          CACHE_STORE: redis
        run: php artisan test --testsuite=Feature --filter='EmailChangeCollisionPgTest'

      - name: Email row-lock timeout behavior (PostgreSQL)
        run: php artisan test --testsuite=Feature --filter='EmailLockTimeoutPgTest'

      - name: Atomic admin email update behavior (PostgreSQL)
        run: php artisan test --testsuite=Feature --filter='EmailAdminUpdatePgTest'

      - name: Queued-job User-row lock ordering (PostgreSQL)
        run: php artisan test --testsuite=Feature --filter='EmailJobLockOrderPgTest'

      - name: Scheduler locking + Redis-outage resilience
        run: php artisan test --testsuite=Feature --filter='SchedulerTest'

      - name: Backup lock against real Redis
        # Override the default store so Cache::lock is exercised on the live
        # Redis service rather than the array store.
        env:
          CACHE_STORE: redis
        run: php artisan test --testsuite=Feature --filter='BackupSchedulingTest'

  # ── Job 3 ──────────────────────────────────────────────────────────────────
  code-style:
    name: Code Style
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Keep composer's post-autoload artisan hooks (package:discover) on the
      # predictable in-memory SQLite config — no database is needed here.
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, bcmath, intl, zip
          coverage: none
          tools: composer:v2

      - name: Validate composer metadata
        run: composer validate --strict --no-check-publish

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-

      - name: Install dependencies (locked)
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Verify optimized autoloader generates cleanly
        run: composer dump-autoload --optimize --strict-psr

      - name: PHP syntax check (lint)
        run: |
          set -euo pipefail
          find app config database routes tests bootstrap -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l >/dev/null

      - name: Laravel Pint (check only)
        run: vendor/bin/pint --test

  # ── Job 4 ──────────────────────────────────────────────────────────────────
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Fail if lock file is missing
        run: test -f package-lock.json || { echo '::error::package-lock.json is required'; exit 1; }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies (locked)
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Verify Vite build output exists
        run: |
          test -f public/build/manifest.json \
            || { echo '::error::Vite build did not produce public/build/manifest.json'; exit 1; }

      - name: Verify self-hosted fonts in the build manifest
        run: |
          set -euo pipefail
          for w in Regular Medium SemiBold Bold ExtraBold Black; do
            for sub in arabic latin; do
              grep -q "Vazirmatn-33.0.3-${w}-${sub}.woff2" public/build/manifest.json \
                || { echo "::error::built manifest is missing Vazirmatn ${w} (${sub} subset)"; exit 1; }
              f="$(python3 -c "import json;m=json.load(open('public/build/manifest.json'));print(m['resources/fonts/vazirmatn/Vazirmatn-33.0.3-${w}-${sub}.woff2']['file'])")"
              test -f "public/build/${f}" \
                || { echo "::error::manifest references a missing font file: ${f}"; exit 1; }
            done
          done
          echo 'All twelve self-hosted Vazirmatn subset files are built and referenced.'

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-logs
          path: |
            npm-debug.log*
            public/build/
          if-no-files-found: ignore
          retention-days: 7

  # ── Job 5 ──────────────────────────────────────────────────────────────────
  shell-tests:
    name: Shell Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Syntax-check all shell scripts
        run: |
          set -euo pipefail
          bash -n install.sh
          bash -n update.sh
          for f in $(find scripts tests -name '*.sh'); do
            echo "bash -n $f"
            bash -n "$f"
          done

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: ShellCheck (errors only, documented exclusions)
        # -S error: only hard errors fail the build (style/info excluded).
        # -x: follow sourced files so shared libs are analysed in context.
        run: |
          shellcheck -S error -x \
            scripts/lib/deploy-lib.sh \
            scripts/lib/installer-lib.sh \
            scripts/lib/supply-chain-lib.sh \
            scripts/deploy/deploy.sh \
            scripts/deploy/rollback.sh \
            scripts/deploy/deploy-status.sh \
            scripts/deploy/doctor.sh \
            scripts/deploy/repair.sh \
            scripts/deploy/install-command-wrappers.sh \
            scripts/zedproxy-sanitize-install-log.sh \
            scripts/build-vazirmatn-subsets.sh \
            tests/deploy/run-tests.sh \
            tests/installer/run-tests.sh \
            tests/supply-chain/run-tests.sh \
            tests/security/run-tests.sh
          shellcheck -S error install.sh update.sh

      - name: Installer helper tests (mocked)
        run: bash tests/installer/run-tests.sh | tee installer-tests.log

      - name: Deployment scenario tests (mocked)
        run: bash tests/deploy/run-tests.sh | tee deploy-tests.log

      - name: Supply-chain helper tests (25 mocked scenarios)
        run: bash tests/supply-chain/run-tests.sh | tee supply-chain-tests.log

      - name: Credential-safety tests (redaction, scan, canary-absence)
        run: bash tests/security/run-tests.sh | tee security-tests.log

      - name: Assert no canary secret survived credential-safety run
        run: |
          set -euo pipefail
          # The security suite feeds CANARY secrets through the redaction/scan
          # helpers. If a complete canary literal reaches the captured log, a
          # secret leaked through a channel that should have masked it.
          if grep -REn 'ZP_CANARY_(ADMIN_SECRET|DB_SECRET|TOKEN|APPKEY)_[0-9a-f]{6,}' security-tests.log; then
            echo '::error::A canary secret survived redaction in the security tests.'
            exit 1
          fi
          echo 'No canary secret leaked into credential-safety output.'

      - name: Assert atomic-updater invariants (no "." repo fallback; services use current)
        run: |
          set -euo pipefail
          # Root cause #1: a production clone must never fall back to "." (the
          # caller's working directory). No deploy path may clone "${ZPD_REPO_URL:-.}".
          if grep -REn 'clone[^\n]*\$\{ZPD_REPO_URL:-\.\}' install.sh update.sh scripts/; then
            echo '::error::A deploy clone falls back to "." (the caller working directory).'
            exit 1
          fi
          # The updater must resolve a repository, never blindly clone ".".
          if grep -REn 'clone[^\n]*"\."' install.sh update.sh scripts/deploy/; then
            echo '::error::A literal clone of "." is present.'
            exit 1
          fi
          # Fresh install + services must target the atomic layout (current/).
          grep -q 'root ${ACTIVE_APP_DIR}/public;' install.sh \
            || { echo '::error::Nginx root does not use ACTIVE_APP_DIR/public (current).'; exit 1; }
          grep -q 'command=php ${ACTIVE_APP_DIR}/artisan queue:work' install.sh \
            || { echo '::error::Supervisor worker does not use ACTIVE_APP_DIR/artisan (current).'; exit 1; }
          grep -q 'zp_scheduler_cron_line "${ACTIVE_APP_DIR}"' install.sh \
            || { echo '::error::Scheduler cron does not use ACTIVE_APP_DIR (current).'; exit 1; }
          grep -q 'zpd_write_deploy_env "$DEPLOY_ENV_FILE"' install.sh \
            || { echo '::error::Installer does not create /etc/zedproxy/deploy.env.'; exit 1; }
          echo 'Atomic-updater invariants hold.'

      - name: Assert legacy-cutover invariants (fail-closed services; wrappers; strict ref)
        run: |
          set -euo pipefail
          dep=scripts/deploy/deploy.sh
          # Defect 1: required Supervisor operations must NOT fail open in the
          # deploy paths, and the git checkout in update.sh must be strict.
          if grep -REn '(supervisorctl|SUPERVISORCTL)[^\n]*(reread|update)[^\n]*\|\| *true' "$dep" scripts/deploy/rollback.sh; then
            echo '::error::A required supervisorctl reread/update is masked by "|| true".'
            exit 1
          fi
          if grep -REn 'checkout[^\n]*\|\| *true' update.sh "$dep"; then
            echo '::error::A git checkout is masked by "|| true" (ref failure would be ignored).'
            exit 1
          fi
          # Defect 2: BOTH install.sh and deploy.sh must (re)install the shared
          # command wrappers so a legacy server is upgraded off the old deployer.
          grep -q 'zpw_install_wrappers' install.sh \
            || { echo '::error::install.sh does not install command wrappers via the shared installer.'; exit 1; }
          grep -q 'zpw_install_wrappers' "$dep" \
            || { echo '::error::deploy.sh does not (re)install command wrappers on activation.'; exit 1; }
          test -f scripts/deploy/install-command-wrappers.sh \
            || { echo '::error::Shared command-wrapper installer is missing.'; exit 1; }
          # Defect 1: the strict cutover + SPLIT readiness (internal vs public
          # HTTP) must exist. dep_verify_release was replaced by the two-phase
          # dep_verify_internal_release / dep_verify_http_release.
          for fn in dep_cutover_supervisor dep_cutover_scheduler \
                    dep_verify_internal_release dep_verify_http_release \
                    dep_supervisor_group_running dep_check_pg dep_check_redis; do
            grep -q "$fn" "$dep" || { echo "::error::deploy.sh missing ${fn} (strict cutover/readiness)."; exit 1; }
          done
          # Defect 3: update.sh resolves + verifies the exact updater SHA.
          grep -q 'RESOLVED_SHA' update.sh && grep -q 'GOT_SHA' update.sh \
            || { echo '::error::update.sh does not resolve/verify the exact updater SHA.'; exit 1; }
          echo 'Legacy-cutover invariants hold.'

      - name: Assert maintenance-readiness + bounded-probe invariants (Prompt 17)
        run: |
          set -euo pipefail
          dep=scripts/deploy/deploy.sh
          lib=scripts/lib/deploy-lib.sh
          # ── Defect A: tool-version probes must be BOUNDED + non-interactive.
          # The bounded, non-interactive probe helper (timeout + </dev/null) and a
          # globally-deadlined metadata collector must exist.
          for fn in dep_probe_version dep_collect_metadata dep_tool_versions; do
            grep -q "$fn" "$dep" || { echo "::error::deploy.sh missing ${fn} (bounded metadata)."; exit 1; }
          done
          grep -Eq 'timeout[[:space:]]+(-k[[:space:]]+"?\$\{ZPD_KILL_GRACE\}"?[[:space:]]+)?"?\$\{ZPD_PROBE_TIMEOUT' "$dep" \
            || { echo '::error::dep_probe_version is not wrapped in a timeout.'; exit 1; }
          grep -q '</dev/null' "$dep" \
            || { echo '::error::probes do not redirect stdin from /dev/null (could block on input).'; exit 1; }
          # No UNBOUNDED direct `composer --version` (or node/npm/php) may exist:
          # every version probe MUST go through dep_probe_version (which is bounded).
          if grep -REn '(\$ZPD_COMPOSER|\$ZPD_NODE|\$ZPD_NPM)[[:space:]"]+[^)]*--version' "$dep" \
               | grep -v 'dep_probe_version'; then
            echo '::error::An unbounded tool --version call exists outside dep_probe_version.'
            exit 1
          fi
          # ── Defect B: public HTTP readiness must run AFTER `artisan up`.
          # Phase A (internal) must NOT perform any public HTTP readiness.
          if awk '/^dep_verify_internal_release\(\)/{f=1} f&&/^}/{f=0} f' "$dep" \
               | grep -Eq 'dep_verify_http_release|dep_health'; then
            echo '::error::Internal (maintenance) readiness performs a public HTTP check.'
            exit 1
          fi
          # In dep_activate, dep_bring_up (exit maintenance) must precede the
          # public HTTP readiness check — never the reverse.
          up_ln="$(grep -n 'dep_bring_up "\$current_dir"' "$dep" | head -1 | cut -d: -f1)"
          http_ln="$(grep -n 'dep_verify_http_release "\$ZPD_HEALTH_URL"' "$dep" | head -1 | cut -d: -f1)"
          [ -n "$up_ln" ] && [ -n "$http_ln" ] && [ "$up_ln" -lt "$http_ln" ] \
            || { echo '::error::HTTP readiness runs before artisan up in dep_activate.'; exit 1; }
          # `php artisan up` must not be masked by "|| true" on any required path.
          if grep -REn 'artisan up[^\n]*\|\| *true' "$dep"; then
            echo '::error::A required `artisan up` is masked by "|| true".'
            exit 1
          fi
          # ── Local loopback health vhost (127.0.0.1, never public).
          for fn in dep_ensure_local_health zpd_local_health_conf_ok zpd_local_health_url; do
            grep -Rq "$fn" "$dep" "$lib" || { echo "::error::missing ${fn} (loopback health vhost)."; exit 1; }
          done
          grep -q '127.0.0.1' "$lib" \
            || { echo '::error::local health vhost is not bound to loopback (127.0.0.1).'; exit 1; }
          # ── Migration-state honesty + maintenance-file (not translated text).
          grep -q 'DEP_MIGRATION_STATUS' "$dep" \
            || { echo '::error::deploy.sh does not track migration state.'; exit 1; }
          grep -q 'zpd_maintenance_file' "$lib" \
            || { echo '::error::maintenance state is not detected via the framework file.'; exit 1; }
          # The health CLI probe must be bounded (timeout), never `|| true`.
          grep -Eq 'timeout[[:space:]]+(-k[[:space:]]+"?\$\{ZPD_KILL_GRACE\}"?[[:space:]]+)?"?\$\{ZPD_HEALTH_CLI_TIMEOUT' "$dep" \
            || { echo '::error::zedproxy:health CLI probe is not bounded by a timeout.'; exit 1; }
          echo 'Maintenance-readiness + bounded-probe invariants hold.'

      - name: Assert self-healing + diagnostics invariants (Prompt 18)
        run: |
          set -euo pipefail
          dep=scripts/deploy/deploy.sh
          # ── Operational reconciliation runs on EVERY activation — never gated
          # on legacy=1. The reconcile entry point must exist and its call site
          # inside dep_activate must not be legacy-conditional.
          for fn in dep_reconcile_operational dep_reconcile_scheduler dep_reconcile_supervisor \
                    dep_reconcile_nginx dep_reconcile_wrappers dep_snapshot_operational_config \
                    dep_restore_operational_snapshot dep_scheduler_scan; do
            grep -q "$fn" "$dep" || { echo "::error::deploy.sh missing ${fn} (self-healing reconciliation)."; exit 1; }
          done
          if awk '/^dep_activate\(\)/{f=1} f&&/^}/{f=0} f' "$dep" \
               | grep 'dep_reconcile_operational' | grep 'legacy' >/dev/null; then
            echo '::error::Operational reconciliation is still gated on legacy=1.'
            exit 1
          fi
          awk '/^dep_activate\(\)/{f=1} f&&/^}/{f=0} f' "$dep" | grep 'dep_reconcile_operational' >/dev/null \
            || { echo '::error::dep_activate does not run operational reconciliation.'; exit 1; }
          # ── No unbounded production smoke: dep_smoke must go through the
          # bounded CLI-health helper, never a direct artisan health call.
          if awk '/^dep_smoke\(\)/{f=1} f&&/^}/{f=0} f' "$dep" | grep 'zedproxy:health' >/dev/null; then
            echo '::error::dep_smoke invokes zedproxy:health directly (unbounded).'
            exit 1
          fi
          awk '/^dep_smoke\(\)/{f=1} f&&/^}/{f=0} f' "$dep" | grep 'dep_cli_health' >/dev/null \
            || { echo '::error::dep_smoke does not use the bounded CLI-health helper.'; exit 1; }
          # ── Every completed failed deployment finalizes its manifest, and the
          # rollback switch/readiness outcomes are recorded separately.
          grep -q 'dep_finalize_failed_release' "$dep" \
            || { echo '::error::failed-release finalization missing.'; exit 1; }
          [ "$(grep -c 'dep_finalize_failed_release' "$dep")" -ge 3 ] \
            || { echo '::error::finalization is not called on every failure path.'; exit 1; }
          grep -q 'rollback_switch=' "$dep" && grep -q 'rollback_readiness=' "$dep" \
            || { echo '::error::rollback switch/readiness are not recorded separately.'; exit 1; }
          grep -q 'dep_reconcile_state' "$dep" \
            || { echo '::error::central state reconciliation missing.'; exit 1; }
          # ── Doctor: exists, wrapped, read-only by default, and its bundle can
          # never include .env contents (no cat/cp/tar of a .env path).
          test -f scripts/deploy/doctor.sh || { echo '::error::doctor.sh missing.'; exit 1; }
          test -f scripts/deploy/repair.sh || { echo '::error::repair.sh missing.'; exit 1; }
          grep -q 'READ-ONLY' scripts/deploy/doctor.sh \
            || { echo '::error::doctor.sh does not declare/keep its read-only default.'; exit 1; }
          grep -q 'zedproxy-doctor' scripts/deploy/install-command-wrappers.sh \
            && grep -q 'zedproxy-deploy-repair' scripts/deploy/install-command-wrappers.sh \
            || { echo '::error::doctor/repair wrappers are not installed.'; exit 1; }
          if grep -En '(cat|cp|tar)[^#]*\.env' scripts/deploy/doctor.sh | grep -v '^\s*#'; then
            echo '::error::doctor.sh reads or copies a .env file into diagnostics.'
            exit 1
          fi
          # ── Scheduler canonicalization + the production fixture are tested.
          grep -q 'scheduler discovery + reconciliation' tests/deploy/run-tests.sh \
            || { echo '::error::scheduler canonicalization tests missing.'; exit 1; }
          grep -q 'PRODUCTION FIXTURE' tests/deploy/run-tests.sh \
            || { echo '::error::production reproduction fixture test missing.'; exit 1; }
          # ── Modern-manifest verification stays strict.
          grep -q 'manifest SHA != deployed HEAD' "$dep" \
            || { echo '::error::strict manifest-SHA verification was removed.'; exit 1; }
          grep -q 'dep_release_verify_mode' "$dep" \
            || { echo '::error::release verify-mode policy missing.'; exit 1; }
          echo 'Self-healing + diagnostics invariants hold.'

      - name: Assert transactionality + fail-closed repair invariants (Prompt 19)
        run: |
          set -euo pipefail
          dep=scripts/deploy/deploy.sh
          rep=scripts/deploy/repair.sh
          doc=scripts/deploy/doctor.sh
          # ── Blocker 1: scheduler-source modifications are TRANSACTIONAL.
          # Every discovered source is captured in the per-deployment snapshot
          # (sources.map) and restored on failure; no unmanaged side backups.
          grep -q 'sched-sources' "$dep" \
            || { echo '::error::scheduler sources are not part of the snapshot.'; exit 1; }
          grep -q 'sources.map' "$dep" \
            || { echo '::error::snapshot lacks the source-to-snapshot map.'; exit 1; }
          if grep -q 'zpd-dedup' "$dep"; then
            echo '::error::unmanaged .zpd-dedup.bak side files are still used.'
            exit 1
          fi
          # Classification and removal share ONE matcher.
          grep -q 'zpd_scheduler_ours_re' scripts/lib/deploy-lib.sh \
            && grep -q 'zpd_scheduler_ours_re' "$dep" \
            || { echo '::error::scheduler classifier/removal do not share a matcher.'; exit 1; }
          # ── Blocker 2: repair --apply is locked and fail-closed.
          grep -q 'zpd_run_locked' "$rep" \
            || { echo '::error::repair --apply does not take the deployment lock.'; exit 1; }
          grep -q 'ZRP_FAILED_STEP' "$rep" && grep -q 'restore_result' "$rep" \
            || { echo '::error::repair does not stop-on-first-failure/record restore.'; exit 1; }
          grep -q 'zrp_backup_metadata' "$rep" \
            || { echo '::error::repair does not back up manifests/state.'; exit 1; }
          # ── Blocker 3: component flags are exact (scheduler tracked separately).
          grep -q 'ZRP_C_SCHED' "$rep" \
            || { echo '::error::--scheduler is not scoped separately from --operational.'; exit 1; }
          # ── Read-only doctor: no write probe; /dev/stdout never a manifest target.
          if grep -q 'dep_check_shared_writable' "$doc"; then
            echo '::error::doctor performs a write probe (not read-only).'
            exit 1
          fi
          if grep -Rn 'zpd_write_manifest /dev/stdout' scripts/; then
            echo '::error::zpd_write_manifest is pointed at /dev/stdout (symlink clobber as root).'
            exit 1
          fi
          # ── Failed rollback switch never orphans the live symlink.
          grep -q 'directory kept in place' "$dep" \
            || { echo '::error::attempted-release rename is not guarded by the active target.'; exit 1; }
          # ── Adoption/compat require shared symlinks; DB/Redis probes bounded.
          grep -q 'dep_check_shared_links' "$dep" \
            || { echo '::error::shared-symlink verification missing from adoption/compat.'; exit 1; }
          grep -Eq 'timeout[[:space:]]+(-k[[:space:]]+"?\$\{ZPD_KILL_GRACE\}"?[[:space:]]+)?"?\$\{ZPD_DB_PROBE_TIMEOUT' "$dep" \
            || { echo '::error::PostgreSQL/Redis probes are not bounded.'; exit 1; }
          echo 'Transactionality + fail-closed repair invariants hold.'

      - name: Assert legacy-rollback, failure-context, and discovery invariants (Prompt 20)
        run: |
          set -euo pipefail
          dep=scripts/deploy/deploy.sh
          rep=scripts/deploy/repair.sh
          # ── First-cutover rollback: bounded Supervisor ops, fail-closed, and a
          # legacy loopback health target (never current/public after rm current).
          body="$(awk '/^dep_first_cutover_rollback\(\)/{f=1} f&&/^}/{f=0} f' "$dep")"
          printf '%s' "$body" | grep 'dep_svc "\$ZPD_SUPERVISORCTL"' >/dev/null \
            || { echo '::error::first-cutover rollback supervisor ops are not bounded.'; exit 1; }
          printf '%s' "$body" | grep -Eq 'SUPERVISORCTL[^\n]*\|\| *true' \
            && { echo '::error::first-cutover rollback supervisor ops fail open.'; exit 1; }
          printf '%s' "$body" | grep '/public"' >/dev/null \
            || { echo '::error::legacy rollback lacks a legacy-root health target.'; exit 1; }
          printf '%s' "$body" | grep 'dep_supervisor_group_running' >/dev/null \
            || { echo '::error::legacy rollback does not require RUNNING workers.'; exit 1; }
          # ── Immutable original-failure context.
          grep -q 'dep_record_failure' "$dep" && grep -q 'original_failure_stage' "$dep" \
            || { echo '::error::immutable original-failure context missing.'; exit 1; }
          grep -q 'rollback_reconciliation=' "$dep" \
            || { echo '::error::rollback reconciliation state not recorded.'; exit 1; }
          # ── Extended scheduler discovery + single active source.
          for fn in dep_scheduler_scan_noncron dep_scheduler_single_source_ok; do
            grep -q "$fn" "$dep" || { echo "::error::missing ${fn} (extended discovery)."; exit 1; }
          done
          grep -q 'zpd_systemd_unit_dir' scripts/lib/deploy-lib.sh \
            || { echo '::error::systemd discovery paths missing.'; exit 1; }
          # ── Fail-closed snapshot restore.
          awk '/^dep_restore_operational_snapshot\(\)/{f=1} f&&/^}/{f=0} f' "$dep" \
            | grep 'dep_supervisor_group_running' >/dev/null \
            || { echo '::error::snapshot restore does not require RUNNING workers.'; exit 1; }
          # ── Exact repair component flags.
          for flag in -- --nginx --supervisor --scheduler --wrappers --health-vhost --manifests --state --operational; do
            [ "$flag" = "--" ] && continue
            grep -q -- "$flag" "$rep" || { echo "::error::repair flag ${flag} missing."; exit 1; }
          done
          # ── Shared failure recorder + central failure events for every stage.
          grep -q 'dep_fail' "$dep" && grep -q 'last-failure.json' "$dep" \
            || { echo '::error::shared failure recorder / central failure event missing.'; exit 1; }
          [ "$(grep -c 'dep_fail ' "$dep")" -ge 8 ] \
            || { echo '::error::dep_fail is not wired into every meaningful stage.'; exit 1; }
          echo 'Legacy-rollback, failure-context, and discovery invariants hold.'

      - name: Assert bounded-command, exact-restore, and metadata-commit invariants (Prompt 21)
        run: |
          set -euo pipefail
          dep=scripts/deploy/deploy.sh
          rep=scripts/deploy/repair.sh
          lib=scripts/lib/deploy-lib.sh
          # ── Fail-closed rollback reconciliation (validate before reload,
          # RUNNING workers required, reconcile+readiness recorded separately).
          body="$(awk '/^dep_rollback_code\(\)/{f=1} f&&/^}/{f=0} f' "$dep")"
          for req in dep_validate_nginx dep_reload_nginx dep_supervisor_group_running DEP_ROLLBACK_RECONCILE DEP_ROLLBACK_READY; do
            printf '%s' "$body" | grep "$req" >/dev/null \
              || { echo "::error::dep_rollback_code lacks ${req} (fail-closed reconciliation)."; exit 1; }
          done
          printf '%s' "$body" | grep -E '\|\| *true' \
            && { echo '::error::dep_rollback_code contains a fail-open reconciliation step.'; exit 1; }
          # ── Mandatory verified legacy snapshot (checked result; abort stage).
          grep -q 'legacy_snapshot_failed' "$dep" \
            || { echo '::error::legacy snapshot failure does not abort the cutover.'; exit 1; }
          awk '/^zpd_save_legacy_rollback\(\)/{f=1} f&&/^}/{f=0} f' "$lib" | grep 'cmp -s' >/dev/null \
            || { echo '::error::legacy snapshot capture is not content-verified.'; exit 1; }
          awk '/^zpd_restore_legacy_rollback\(\)/{f=1} f&&/^}/{f=0} f' "$lib" | grep 'cmp -s' >/dev/null \
            || { echo '::error::legacy restore is not content-verified.'; exit 1; }
          # ── Every blocking production command is bounded (shared runner +
          # per-stage deadlines; no unlimited umbrella timeout).
          grep -q 'dep_run_bounded()' "$dep" \
            || { echo '::error::shared bounded runner dep_run_bounded missing.'; exit 1; }
          for var in ZPD_BACKUP_TIMEOUT ZPD_BUILD_TIMEOUT ZPD_COMPOSER_TIMEOUT ZPD_NPM_TIMEOUT ZPD_ARTISAN_TIMEOUT ZPD_MIGRATION_TIMEOUT ZPD_MAINTENANCE_TIMEOUT; do
            grep -q "$var" "$dep" || { echo "::error::stage timeout ${var} missing."; exit 1; }
          done
          awk '/^dep_run_migrations\(\)/{f=1} f&&/^}/{f=0} f' "$dep" | grep 'unknown' >/dev/null \
            || { echo '::error::migration timeout does not record UNKNOWN DB state.'; exit 1; }
          awk '/^dep_backup_database\(\)/{f=1} f&&/^}/{f=0} f' "$dep" | grep 'rm -f "\$out"' >/dev/null \
            || { echo '::error::incomplete pg_dump output is not removed on failure.'; exit 1; }
          grep -q 'maintenance_fence_failed' "$dep" \
            || { echo '::error::artisan down fencing is not required (best-effort).'; exit 1; }
          # ── Transactional metadata/state repair (existence recorded; exact
          # restore verified; audit record outside the transaction).
          grep -q 'state.existed' "$rep" \
            || { echo '::error::state-file existence is not recorded in the repair snapshot.'; exit 1; }
          awk '/^zrp_restore_metadata\(\)/{f=1} f&&/^}/{f=0} f' "$rep" | grep 'cmp -s' >/dev/null \
            || { echo '::error::metadata restore is not content-verified.'; exit 1; }
          # ── Component-scoped restore (a scheduler/metadata repair must not
          # rewrite or reload unrelated live services).
          grep -q 'restore_scope' "$rep" \
            || { echo '::error::repair restore is not component-scoped.'; exit 1; }
          awk '/^dep_restore_operational_snapshot\(\)/{f=1} f&&/^}/{f=0} f' "$dep" | grep 'scope' >/dev/null \
            || { echo '::error::operational snapshot restore lacks a scope parameter.'; exit 1; }
          # ── Complete scheduler discovery (all systemd trees, drop-ins,
          # systemctl cat/list-timers, supervisord [include] globs) and the
          # active-vs-inactive distinction.
          grep -q 'zpd_systemd_unit_dirs' "$dep" \
            || { echo '::error::discovery does not scan every systemd unit tree.'; exit 1; }
          grep -q 'list-timers' "$dep" && grep -q 'list-unit-files' "$dep" \
            || { echo '::error::systemctl-reported units are not inspected.'; exit 1; }
          grep -q '_dep_supervisor_effective_files' "$dep" && grep -q 'include' "$dep" \
            || { echo '::error::effective supervisord include-glob set is not scanned.'; exit 1; }
          for fn in dep_scheduler_filter_active dep_scheduler_active_conflicts; do
            grep -q "$fn" "$dep" || { echo "::error::missing ${fn} (active-vs-inactive distinction)."; exit 1; }
          done
          # ── Required success-metadata commit (never silent success).
          grep -q 'metadata_commit' "$dep" && grep -q 'code_active=true' "$dep" \
            || { echo '::error::final manifest write failure is not surfaced as metadata_commit.'; exit 1; }
          grep -q 'state_reconcile_failed_after_success' "$dep" \
            || { echo '::error::degraded success (state reconcile failure) is not recorded.'; exit 1; }
          echo 'Bounded-command, exact-restore, and metadata-commit invariants hold.'

      - name: Assert TERM-KILL, worker-fence, inventory, unknown-state, and fresh-snapshot behavior (Prompt 22)
        run: |
          set -euo pipefail
          log=deploy-tests.log
          # ── BEHAVIORAL evidence: the Prompt-22 test group must have RUN and
          # PASSED in this very job (static greps alone are insufficient).
          for line in \
            'SIGTERM-ignoring child is SIGKILLed after the grace period' \
            'deployment lock released after the bounded failure' \
            'deploy fails when the worker fence cannot verify STOPPED' \
            'current never switched' \
            'failure recorded at stage=worker_stop' \
            'wrapper capture failure fails the snapshot' \
            'deploy.env bytes restored' \
            'symlink target restored' \
            'unknown systemd state blocks reconciliation' \
            'systemctl timeout blocks reconciliation' \
            'unparseable supervisor status is unknown' \
            'committed snapshot records snapshot_complete=true' \
            'restore refuses an uncommitted snapshot' \
            'restore refuses an old-schema snapshot'; do
            grep -F "ok   - " "$log" | grep -qF "$line" \
              || { echo "::error::Prompt-22 behavioral test did not pass: ${line}"; exit 1; }
          done
          if grep -F "  FAIL - " "$log" >/dev/null; then echo '::error::deploy suite has failures.'; exit 1; fi
          # ── Static invariants for the same fixes.
          dep=scripts/deploy/deploy.sh
          grep -q 'dep_svc() { timeout -k' "$dep" \
            || { echo '::error::dep_svc is not TERM-then-KILL bounded.'; exit 1; }
          if grep -nE 'timeout "\$\{ZPD_[A-Z_]+(_TIMEOUT[^}]*)?\}s?"' "$dep" scripts/lib/deploy-lib.sh scripts/deploy/doctor.sh | grep -v 'timeout -k'; then
            echo '::error::plain (non -k) timeout invocation remains.'; exit 1
          fi
          grep -q 'dep_stop_workers()' "$dep" && grep -q 'worker_stop_failed' "$dep" \
            || { echo '::error::required worker fencing missing.'; exit 1; }
          grep -q 'inventory.tsv' "$dep" && grep -q 'sha256sum' "$dep" \
            || { echo '::error::manifest-driven snapshot inventory missing.'; exit 1; }
          grep -q 'zpw_backup_wrappers .*|| true' "$dep" \
            && { echo '::error::wrapper snapshot is still fail-open.'; exit 1; }
          grep -q '_dep_systemd_state_class' "$dep" \
            || { echo '::error::explicit systemd state classification missing.'; exit 1; }
          grep -q 'snapshot_complete' scripts/lib/deploy-lib.sh \
            && grep -q 'snapshot_schema_version' scripts/lib/deploy-lib.sh \
            || { echo '::error::committed fresh-snapshot protocol missing.'; exit 1; }
          echo 'Prompt-22 behavioral coverage and invariants hold.'

      - name: Assert fail-closed discovery, strict worker status, atomic snapshots, and probe hygiene (Prompt 23)
        run: |
          set -euo pipefail
          log=deploy-tests.log
          # ── BEHAVIORAL evidence from this job's own run.
          for line in \
            'list-unit-files failure blocks reconciliation' \
            'list-timers failure blocks reconciliation' \
            'systemctl cat failure blocks reconciliation' \
            'list-unit-files timeout blocks reconciliation' \
            'malformed list-unit-files output blocks reconciliation' \
            'unexpected list-unit-files rc makes timer existence UNKNOWN' \
            'rc=1 with unrelated output rejects the fence' \
            'rc=3 with an error message rejects the fence' \
            'rc=0 with UNRELATED programs only never proves absence' \
            'mixed STOPPED and RUNNING lines reject the fence' \
            'failed SNAPSHOT.json write fails the snapshot' \
            'restore refuses the interrupted .tmp snapshot' \
            'restore refuses an old snapshot schema' \
            'restore fails on a snapshot hash mismatch' \
            'metadata probe works WITHOUT COMPOSER_ALLOW_SUPERUSER' \
            'unknown migration reported as INDETERMINATE' \
            'WorkingDirectory + relative artisan systemd unit blocks' \
            'manual legacy rollback succeeds without DEP_SNAPSHOT_DIR' \
            'metadata-only repair succeeds despite broken wrappers (scoped capture)' \
            'state repair refuses a non-canonical current target' \
            'state symlink target preserved'; do
            grep -F "ok   - " "$log" | grep -qF "$line" \
              || { echo "::error::Prompt-23 behavioral test did not pass: ${line}"; exit 1; }
          done
          # ── Static invariants.
          dep=scripts/deploy/deploy.sh
          grep -q 'DISCOVERY_ERROR' "$dep" \
            || { echo '::error::structured discovery-status records missing.'; exit 1; }
          if awk '/^dep_probe_version\(\)/{f=1} f&&/^}/{f=0} f' "$dep" | grep -q 'COMPOSER_ALLOW_SUPERUSER'; then
            echo '::error::metadata probe still enables root Composer plugins.'; exit 1
          fi
          grep -q 'snapshot_complete=false' "$dep" && grep -q 'snapshot_complete=true' "$dep" \
            || { echo '::error::operational snapshot commit protocol missing.'; exit 1; }
          if awk '/^dep_snapshot_operational_config\(\)/{f=1} f&&/^}/{f=0} f' "$dep" \
               | grep -E 'chmod (700|600)' | grep -E '\|\| true'; then
            echo '::error::snapshot directory/map protection is still best-effort.'; exit 1
          fi
          echo 'Prompt-23 fail-closed discovery, worker-status, snapshot, and probe invariants hold.'

      - name: Assert SEO hardening invariants (noindex-before-render, targeted seeding, nginx robots/www/gzip, fonts, schema, images)
        run: |
          set -euo pipefail
          log=deploy-tests.log
          # ── BEHAVIORAL evidence from this job's own run.
          for line in \
            'required-defaults seeding failure fails the deploy' \
            'current NOT switched after a seeding failure' \
            'wrong fallback replaced, not duplicated' \
            'unclosed robots block refused' \
            'duplicate robots blocks refused' \
            'regex robots location refused' \
            'robots block NOT inserted inside the favicon block' \
            'mode and ownership preserved after repair' \
            'second www reconciliation is byte-identical' \
            'certbot lines byte-identical' \
            'no invalid 443 www block' \
            'canonical host does not redirect' \
            'second gzip run is byte-identical' \
            'custom gzip config untouched' \
            'redirect-only block has no gzip' \
            'coverage loss makes the 443 www block drift' \
            'rewrite adds the 443 www block after coverage appears' \
            'backup creation failure fails the cutover' \
            'config NOT mutated without a verified backup' \
            'restored from the FRESH backup, not the stale artifact' \
            'restore preserved mode and ownership' \
            'no pre-cutover backup left after success' \
            'HTTPS block segment restored' \
            'min length restored exactly once' \
            'two-block gzip second run byte-identical'; do
            # single pipeline-free grep: -q + a pipe can SIGPIPE under pipefail
            grep -qF "ok   - ${line}" "$log" \
              || { echo "::error::SEO-hardening behavioral test did not pass: ${line}"; exit 1; }
          done
          # ── Static invariants.
          grep -q "attributes->set(self::REQUEST_ATTRIBUTE, true)" app/Http/Middleware/NoIndexHeaders.php \
            || { echo '::error::noindex middleware no longer publishes its verdict before render.'; exit 1; }
          grep -q 'NoIndexHeaders::REQUEST_ATTRIBUTE' app/Services/Seo/SeoManager.php \
            || { echo '::error::SeoManager no longer honors the middleware noindex verdict.'; exit 1; }
          grep -q 'zedproxy:seed-required-defaults' install.sh \
            || { echo '::error::install.sh no longer ensures required default records.'; exit 1; }
          if grep -q 'artisan db:seed' install.sh scripts/deploy/deploy.sh; then
            echo '::error::full DatabaseSeeder must never run on install/deploy.'; exit 1
          fi
          grep -qF 'try_files $uri /index.php?$query_string;' scripts/lib/deploy-lib.sh \
            || { echo '::error::robots mutator lost the exact Laravel fallback.'; exit 1; }
          grep -q 'acme-challenge' scripts/lib/deploy-lib.sh \
            || { echo '::error::www redirect lost the ACME HTTP-01 exemption.'; exit 1; }
          grep -q 'zpd_cert_covers_www' scripts/lib/deploy-lib.sh \
            || { echo '::error::443 www redirect is no longer SAN-gated.'; exit 1; }
          if { grep -hE '^[[:space:]]*gzip_types ' install.sh; grep -h 'ZPD_GZIP_TYPES=' scripts/lib/deploy-lib.sh; } \
               | grep -Eq 'text/html|woff2|image/(png|jpeg|webp|gif)'; then
            echo '::error::gzip_types must not list text/html or compressed formats.'; exit 1
          fi
          if grep -Rq 'fonts\.googleapis\.com\|fonts\.gstatic\.com' resources/views; then
            echo '::error::Google Fonts URLs found in production views.'; exit 1
          fi
          for w in Regular Medium SemiBold Bold ExtraBold Black; do
            for sub in arabic latin; do
              test -f "resources/fonts/vazirmatn/Vazirmatn-33.0.3-${w}-${sub}.woff2" \
                || { echo "::error::missing vendored Vazirmatn subset: ${w}-${sub}"; exit 1; }
            done
          done
          if ls resources/fonts/vazirmatn/ | grep -q 'Light'; then
            echo '::error::unused Light/ExtraLight font weight is vendored.'; exit 1
          fi
          test -f resources/fonts/vazirmatn/OFL.txt \
            || { echo '::error::the SIL OFL license must ship beside the fonts.'; exit 1; }
          grep -q "'sku' => (string) \$plan->slug" app/Services/Seo/SchemaBuilder.php \
            || { echo '::error::Product schema lost the stable slug sku.'; exit 1; }
          grep -q 'offerPriceValidUntil' app/Services/Seo/SchemaBuilder.php \
            || { echo '::error::priceValidUntil must come from the validated setting only.'; exit 1; }
          grep -q 'loading="eager" fetchpriority="high"' resources/views/partials/site-logo.blade.php \
            || { echo '::error::header logos are no longer eager/high-priority.'; exit 1; }
          echo 'SEO hardening invariants hold.'

      # ── Supply-chain verification (authoritative home; formerly the separate
      #    supply-chain.yml workflow, folded in here to remove duplicate jobs). ──
      - name: Assert no forbidden supply-chain patterns remain
        run: |
          set -euo pipefail
          source scripts/lib/supply-chain-lib.sh
          if ! zsc_scan_forbidden install.sh update.sh \
                 scripts/deploy/deploy.sh scripts/deploy/rollback.sh \
                 scripts/deploy/deploy-status.sh scripts/backup.sh; then
            echo '::error::Unsafe supply-chain pattern found (curl|bash, curl|php, npm fallback, composer update).'
            exit 1
          fi
          # Belt-and-braces raw grep for the two banned pipes (ignore comments).
          if grep -REn '(curl|wget)[^|]*\|[[:space:]]*(bash|sh|php)([[:space:]]|-|$)' \
               install.sh update.sh scripts/ | grep -vE ':[[:space:]]*#'; then
            echo '::error::A curl|bash / curl|php pattern is present.'
            exit 1
          fi
          echo 'No unsafe supply-chain patterns.'

      - name: Lock files, version policy, and version-drift check
        run: |
          set -euo pipefail
          source scripts/lib/supply-chain-lib.sh
          zsc_require_lockfiles . >/dev/null || { echo '::error::composer.lock / package-lock.json missing'; exit 1; }
          test -n "$ZSC_SUPPORTED_UBUNTU" && test -n "$ZSC_NODE_MAJOR" && test -n "$ZSC_PHP_MIN"
          # The supply-chain lib is the authoritative runtime-version source;
          # assert the workflow + installer + README do not drift from it.
          ci_php="$(grep -E '^  PHP_VERSION:' .github/workflows/ci.yml | grep -oE '[0-9]+\.[0-9]+' | head -1)"
          ci_node="$(grep -E '^  NODE_VERSION:' .github/workflows/ci.yml | grep -oE '[0-9]+' | head -1)"
          inst_node="$(grep -E '^NODE_VERSION=' install.sh | grep -oE '[0-9]+' | head -1)"
          zsc_check_php "$ci_php" || { echo "::error::ci.yml PHP_VERSION $ci_php outside policy $ZSC_PHP_MIN-$ZSC_PHP_MAX"; exit 1; }
          [ "$ci_node" = "$ZSC_NODE_MAJOR" ]   || { echo "::error::ci.yml NODE_VERSION $ci_node != policy $ZSC_NODE_MAJOR"; exit 1; }
          [ "$inst_node" = "$ZSC_NODE_MAJOR" ] || { echo "::error::install.sh NODE_VERSION $inst_node != policy $ZSC_NODE_MAJOR"; exit 1; }
          grep -qF "${ZSC_PHP_MIN} – ${ZSC_PHP_MAX}" README.md \
            || grep -qF "${ZSC_PHP_MIN}-${ZSC_PHP_MAX}" README.md \
            || { echo '::error::README PHP version range drifted from supply-chain-lib policy'; exit 1; }
          echo "Version policy OK: Ubuntu[$ZSC_SUPPORTED_UBUNTU] PHP[$ZSC_PHP_MIN-$ZSC_PHP_MAX] Node[$ZSC_NODE_MAJOR] PG[$ZSC_PG_MIN-$ZSC_PG_MAX] Redis[$ZSC_REDIS_MIN-$ZSC_REDIS_MAX]"

      - name: Validate deployment version-metadata generation
        run: |
          set -euo pipefail
          source scripts/lib/supply-chain-lib.sh
          sha="$(zsc_git_resolve . HEAD)"
          printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$' \
            || { echo '::error::resolved commit SHA is not a full 40-hex value'; exit 1; }
          tag="$(zsc_git_tag_for . "$sha" || true)"
          php_v="$(zsc_tool_version php)"
          printf '{"commit":"%s","tag":"%s","php_version":"%s"}\n' "$sha" "$tag" "$php_v"
          echo 'Version metadata generation OK.'

      - name: Upload shell test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shell-test-logs
          path: |
            installer-tests.log
            deploy-tests.log
            supply-chain-tests.log
            security-tests.log
          if-no-files-found: ignore
          retention-days: 7

  # ── Job 6 ──────────────────────────────────────────────────────────────────
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      # The audit policy + allowlist are the SAME ones the installer and the
      # atomic deploy use (scripts/lib/supply-chain-lib.sh + this file), so CI
      # can never pass an advisory the installer would reject, or vice-versa.
      AUDIT_ALLOWLIST: .zedproxy/audit-allowlist
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, bcmath, intl, zip
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-

      - name: Install dependencies (locked)
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Single authoritative audit implementation (composer + npm) driving the
      # documented severity policy from supply-chain-lib.sh:
      #   critical → fail; high → fail unless an UNEXPIRED allowlist entry;
      #   moderate/low → report. Abandoned/malformed/expired entries never
      #   suppress. Output is masked; failures are never swallowed.
      - name: Dependency audit under documented policy (composer + npm)
        shell: bash
        run: |
          set -uo pipefail
          source scripts/lib/supply-chain-lib.sh
          today="$(date -u +%Y-%m-%d)"
          tmp="$(mktemp)"
          composer audit --format=json --no-interaction 2>/dev/null \
            | php -r '$d=json_decode(stream_get_contents(STDIN),true)?:[]; foreach(($d["advisories"]??[]) as $p=>$as){foreach($as as $a){printf("%s\t%s\t%s\n",$p,$a["advisoryId"]??($a["cve"]??"unknown"),strtolower($a["severity"]??"unknown"));}}' \
            >> "$tmp" || true
          npm audit --json 2>/dev/null \
            | php -r '$d=json_decode(stream_get_contents(STDIN),true)?:[]; foreach(($d["vulnerabilities"]??[]) as $n=>$v){$sev=strtolower($v["severity"]??"unknown");$id="npm"; if(!empty($v["via"])&&is_array($v["via"])){foreach($v["via"] as $via){if(is_array($via)){$id=(string)($via["url"]??$via["source"]??"npm");break;}}} printf("%s\t%s\t%s\n",$n,$id,$sev);}' \
            >> "$tmp" || true
          fails=0; findings=0
          while IFS=$'\t' read -r pkg adv sev; do
            [ -n "$pkg" ] || continue
            findings=$((findings+1))
            allowed=0
            zsc_allowlist_entry_active "$AUDIT_ALLOWLIST" "$pkg" "$adv" "$today" && allowed=1
            decision="$(zsc_audit_decision "$sev" "$allowed")"
            line="$(printf '%s advisory=%s severity=%s' "$pkg" "$adv" "$sev" | zsc_mask_secrets)"
            case "$decision" in
              fail)   echo "::error::[audit] BLOCKING $line"; fails=$((fails+1)) ;;
              report) [ "$allowed" = 1 ] && echo "[audit] allowlisted $line" || echo "::warning::[audit] $line" ;;
            esac
          done < "$tmp"
          rm -f "$tmp"
          echo "audit findings: $findings, blocking: $fails"
          [ "$fails" -eq 0 ] || { echo '::error::Critical/high (non-allowlisted) advisories present.'; exit 1; }

      - name: Fail if a real .env file is committed
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo '::error::A real .env file is tracked in git. Remove it and use .env.example.'
            exit 1
          fi
          echo 'No committed .env files.'

      - name: Scan for committed private keys / credentials (values redacted)
        run: |
          set -uo pipefail
          # Search tracked files only; print file names and matched keywords, never values.
          if git grep -I -l -E 'BEGIN( RSA| OPENSSH| DSA| EC| PGP)? PRIVATE KEY' -- . ':!*.example' ':!README.md'; then
            echo '::error::A private key appears to be committed (value not shown).'
            exit 1
          fi
          echo 'No committed private keys detected.'

      - name: Static audit — installer must not leak credentials into logs
        shell: bash
        run: |
          set -uo pipefail
          fail=0
          note() { echo "::error::$*"; fail=1; }

          # 1) The tee-to-logfile pipeline must NOT be re-introduced for the
          #    final summary, and no credential variable may be echoed.
          if grep -En 'echo.*\$\{?(ADMIN_PASS|DB_PASS|APP_KEY|ZEDPROXY_ADMIN_PASS)\}?' install.sh update.sh; then
            note 'A credential variable is echoed in an installer script.'
          fi

          # 2) Raw $BASH_COMMAND must never be logged (ERR trap must mask it).
          if grep -En 'log[_a-zA-Z]*[^#]*\$\{?BASH_COMMAND\}?' install.sh update.sh; then
            note 'Raw $BASH_COMMAND is logged (must be masked via zp_mask_command).'
          fi

          # 3) No credential-bearing Authorization header passed on a curl CLI
          #    (leaks into ps/argv and shell tracing). Use --config / netrc.
          if grep -En "curl[^\n]*-H[[:space:]]+['\"]?Authorization:[[:space:]]*(Bearer|Basic)[[:space:]]+\\\$" \
               install.sh update.sh scripts/*.sh scripts/deploy/*.sh 2>/dev/null; then
            note 'A curl Authorization header interpolates a secret on the command line.'
          fi

          # 4) A password/secret must not be passed as a CLI flag value.
          if grep -En -- '--(password|db-password|secret|token)[= ]+\$\{?[A-Za-z_]' \
               install.sh update.sh scripts/*.sh scripts/deploy/*.sh 2>/dev/null; then
            note 'A secret is passed as a command-line flag value (visible in ps/argv).'
          fi

          # 5) Production installer paths must not enable shell tracing.
          if grep -En '^\s*set[[:space:]]+-[a-z]*x' install.sh update.sh scripts/*.sh scripts/deploy/*.sh 2>/dev/null; then
            note 'set -x (shell tracing) present in a production script.'
          fi

          [ "$fail" -eq 0 ] && echo 'No unsafe credential-logging patterns found.'
          exit "$fail"

      - name: Install gitleaks (pinned)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Secret scan (gitleaks, redacted)
        # Scan the working tree (--no-git) with the repo allowlist; --redact
        # ensures any finding is reported without printing the secret value.
        run: gitleaks detect --source . --no-git --config .gitleaks.toml --no-banner --redact --exit-code 1

      # Supplementary: GitHub Dependency Review augments the audits above on PRs.
      # It requires the Dependency Graph API, which may be unavailable on some
      # private plans; it fails gracefully here because composer/npm audit above
      # are the enforced dependency gates.
      - name: Dependency review (PRs only, best-effort)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  # ── Job 7 ──────────────────────────────────────────────────────────────────
  migration-validation:
    name: Migration Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: zedproxy_migrate
          POSTGRES_USER: zedproxy
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U zedproxy"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: zedproxy_migrate
      DB_USERNAME: zedproxy
      DB_PASSWORD: secret
      CACHE_STORE: array
      QUEUE_CONNECTION: sync

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, pgsql, mbstring, bcmath, intl, zip
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-

      - name: Install dependencies (locked)
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Fresh migration succeeds
        run: php artisan migrate --force

      - name: No pending migrations remain
        run: |
          php artisan migrate:status
          if php artisan migrate:status | grep -i 'Pending'; then
            echo '::error::Pending migrations detected after a fresh migrate.'
            exit 1
          fi

      - name: Re-running migrate is a no-op (idempotent)
        run: |
          out="$(php artisan migrate --force)"
          echo "$out"
          echo "$out" | grep -qi 'Nothing to migrate' \
            || { echo '::error::A second migrate should be a no-op.'; exit 1; }

      - name: PostgreSQL-specific partial indexes are created
        run: |
          php -r '
            $c = new PDO("pgsql:host=127.0.0.1;port=5432;dbname=zedproxy_migrate", "zedproxy", "secret");
            $required = [
              "orders_user_fingerprint_unpaid_unique",
              "user_services_order_id_unique",
            ];
            $have = $c->query("SELECT indexname FROM pg_indexes")->fetchAll(PDO::FETCH_COLUMN);
            foreach ($required as $idx) {
              if (!in_array($idx, $have, true)) {
                fwrite(STDERR, "::error::Expected PostgreSQL index missing: $idx\n");
                exit(1);
              }
              echo "index present: $idx\n";
            }
          '

      - name: Duplicate-data guard fails clearly
        # The purchase-fingerprint migration refuses to add its unique index when
        # conflicting unpaid orders already exist. We seed a conflict, drop the
        # index, and invoke the migration's up() directly (the migrator would
        # skip an already-run migration) — it must abort with a clear "duplicate"
        # error and delete nothing.
        run: |
          # Written into the workspace so __DIR__ resolves to the app root.
          cat > ci_guard_check.php <<'PHP'
          <?php
          require __DIR__.'/vendor/autoload.php';
          $app = require __DIR__.'/bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();

          $u = \App\Models\User::factory()->create();
          $p = \App\Models\Plan::factory()->create(['is_active' => true]);

          \Illuminate\Support\Facades\DB::statement('DROP INDEX IF EXISTS orders_user_fingerprint_unpaid_unique');

          foreach ([1, 2] as $i) {
              \App\Models\Order::create([
                  'user_id'              => $u->id,
                  'plan_id'              => $p->id,
                  'plan_name'            => $p->name,
                  'purchase_fingerprint' => 'dup-fingerprint',
                  'price_toman'          => 1000,
                  'final_price_toman'    => 1000,
                  'payment_status'       => 'unpaid',
                  'status'               => 'pending',
              ]);
          }

          $before = \Illuminate\Support\Facades\DB::table('orders')->count();
          $migration = require __DIR__.'/database/migrations/2026_07_23_160100_add_purchase_fingerprint_to_orders.php';

          try {
              $migration->up();
              fwrite(STDERR, "::error::Duplicate-data guard did NOT fail as expected.\n");
              exit(1);
          } catch (\Throwable $e) {
              $after = \Illuminate\Support\Facades\DB::table('orders')->count();
              if ($after !== $before) {
                  fwrite(STDERR, "::error::Guard deleted data (before=$before after=$after).\n");
                  exit(1);
              }
              if (stripos($e->getMessage(), 'duplicate') === false) {
                  fwrite(STDERR, "::error::Guard failed without a clear duplicate message: {$e->getMessage()}\n");
                  exit(1);
              }
              echo "Guard aborted clearly and preserved all rows: {$e->getMessage()}\n";
              exit(0);
          }
          PHP
          php ci_guard_check.php
          rm -f ci_guard_check.php
